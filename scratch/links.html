<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>genesis - Enlaces</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary-color: #4a2c11;
            /* Espresso Dark */
            --secondary-color: #c48d49;
            /* Caramel Gold */
            --accent-color: #5d3e26;
            /* Cocoa Medium */
            --bg-color: #faf6f0;
            /* Cream Soft */
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow-md: 0 10px 30px rgba(41, 23, 7, 0.15);
            --shadow-lg: 0 20px 50px rgba(41, 23, 7, 0.25);
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: url('img/fondo8.png');
            background-repeat: repeat;
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Frosted overlay veil to improve text contrast on beautiful background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(41, 23, 7, 0.55);
            z-index: -1;
            pointer-events: none;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 500px;
            margin-bottom: 25px;
        }

        .slideshow {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.15), var(--shadow-md);
            margin-bottom: 20px;
            border: 2px solid var(--secondary-color);
        }

        .slideshow img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            animation: fade 9s infinite;
        }

        .slideshow img:nth-child(1) {
            animation-delay: 0s;
        }

        .slideshow img:nth-child(2) {
            animation-delay: 3s;
        }

        .slideshow img:nth-child(3) {
            animation-delay: 6s;
        }

        @keyframes fade {
            0% {
                opacity: 0;
            }

            8% {
                opacity: 1;
            }

            33% {
                opacity: 1;
            }

            41% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            font-weight: 700;
        }

        h1.slogan {
            font-size: 1.2rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--secondary-color);
            margin-bottom: 20px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            margin-top: 30px;
            margin-bottom: 18px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 6px;
            text-align: center;
            background-color: rgba(41, 23, 7, 0.4);
            padding: 8px 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 600;
        }

        p.select-branch {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #faf6f0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
            text-align: center;
            font-weight: 400;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 420px;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-radius: 16px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.3) 100%);
            transform: skewX(-25deg);
            transition: 0.75s;
        }

        .link-card:hover::before {
            left: 150%;
        }

        .link-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            background: #fff;
            border-color: var(--secondary-color);
            color: var(--accent-color);
        }

        .link-card img {
            width: 26px;
            height: 26px;
            margin-right: 14px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .link-card:hover img {
            transform: scale(1.15);
        }

        /* Specialized card style for Instagram */
        .instagram-btn {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(250, 246, 240, 0.85));
            border-color: rgba(255, 255, 255, 0.4);
            margin-bottom: 10px;
        }

        footer {
            margin-top: 50px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
            text-align: center;
            letter-spacing: 0.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
